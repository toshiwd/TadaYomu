name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build, for example v1.3.75'
        required: true
        default: 'v1.3.75'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Restore Google Services
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            echo "::error::GOOGLE_SERVICES_JSON_BASE64 is not configured"
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > google-services.json
          test -s google-services.json

      - name: Generate Android project
        run: CI=1 npx expo prebuild --platform android --no-install

      - name: Decode keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_KEYSTORE_BASE64:-}" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 is not configured"
            exit 1
          fi
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          test -s android/app/release.keystore

      - name: Build Release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Extract version from tag
        id: version
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: echo "VERSION=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Generate version.json
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          cat > version.json << EOF
          {
            "version": "${{ steps.version.outputs.VERSION }}",
            "apkUrl": "https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}/TadaYomu-${{ steps.version.outputs.VERSION }}.apk",
            "releaseNotes": "バージョン ${{ steps.version.outputs.VERSION }} リリース"
          }
          EOF

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk TadaYomu-${{ steps.version.outputs.VERSION }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: |
            TadaYomu-${{ steps.version.outputs.VERSION }}.apk
            version.json
          generate_release_notes: true
